name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE"]   # a typo fix should not cost minutes
  pull_request:
  workflow_dispatch:

# Least privilege. A called workflow can only reduce this, never add to it.
permissions:
  contents: read

# Concurrency belongs in the CALLER: it owns the trigger, so it owns the
# question of what supersedes what.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The merge gate: only what this repository controls. Ruff, test collection
  # and the API tests. The browser tests drive a public practice site that is
  # not ours, so they live in live-sites.yml and do not gate a merge.
  #
  # API tests need no browser at all -- saves ~90s of install per run.
  # A test that is also marked `ui` asks for a browser fixture and this job
  # installs none, so "not ui" keeps it out of here. It still runs locally.
  api:
    uses: suryakulshreshtha/.github/.github/workflows/python-playwright.yml@v1
    with:
      needs-browser: false
      pytest-args: -m "api and not ui"
